name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:

      # --------------------------------------------------
      # 1. Configure Windows Remote Desktop
      # --------------------------------------------------
      - name: Configure Core RDP Settings
        shell: powershell
        run: |

          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          # Keep Network Level Authentication enabled
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          # Use standard RDP security layer
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "SecurityLayer" `
            -Value 1 `
            -Force

          Write-Host "Configuring Windows Firewall..."

          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Write-Host "Restarting Remote Desktop service..."

          Restart-Service -Name TermService -Force

          Write-Host "RDP configuration complete."


      # --------------------------------------------------
      # 2. Create RDP account
      # --------------------------------------------------
      - name: Create RDP User
        shell: powershell
        run: |

          Write-Host "Creating RDP user..."

          Add-Type -AssemblyName System.Security

          $upper = [char[]](65..90)
          $lower = [char[]](97..122)
          $numbers = [char[]](48..57)
          $special = [char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126)

          $passwordChars = @()

          $passwordChars += $upper | Get-Random -Count 4
          $passwordChars += $lower | Get-Random -Count 4
          $passwordChars += $numbers | Get-Random -Count 4
          $passwordChars += $special | Get-Random -Count 4

          $password = -join ($passwordChars | Sort-Object { Get-Random })

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          # Remove old account if it somehow exists
          $existingUser = Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue

          if ($existingUser) {
              Remove-LocalUser -Name "RDP"
          }

          New-LocalUser `
            -Name "RDP" `
            -Password $securePassword `
            -AccountNeverExpires `
            -PasswordNeverExpires `
            -Description "Temporary RDP account"

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP"

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP"

          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              Write-Error "RDP user creation failed."
              exit 1
          }

          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

          Write-Host "RDP user created successfully."


      # --------------------------------------------------
      # 3. Connect runner to your Tailscale network
      # --------------------------------------------------
      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}


      # --------------------------------------------------
      # 4. Get Tailscale IPv4 address
      # --------------------------------------------------
      - name: Get Tailscale IP
        shell: powershell
        run: |

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              Write-Error "Tailscale executable was not found."
              exit 1
          }

          $tsIP = $null

          for ($i = 1; $i -le 12; $i++) {

              Write-Host "Waiting for Tailscale IP... attempt $i/12"

              $tsIP = & $tailscale ip -4 2>$null

              if ($tsIP) {
                  break
              }

              Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IPv4 address was not assigned."
              exit 1
          }

          $tsIP = $tsIP.Trim()

          Write-Host "Tailscale IPv4: $tsIP"

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV


      # --------------------------------------------------
      # 5. Verify RDP service
      # --------------------------------------------------
      - name: Verify RDP
        shell: powershell
        run: |

          Write-Host "Testing local RDP service..."

          $rdpTest = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389

          if (-not $rdpTest.TcpTestSucceeded) {
              Write-Error "RDP port 3389 is not listening."
              exit 1
          }

          Write-Host "RDP port 3389 is listening."


      # --------------------------------------------------
      # 6. Display connection information
      # --------------------------------------------------
      - name: Show RDP Information
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "======================================"
          Write-Host "          RDP IS READY"
          Write-Host "======================================"
          Write-Host ""
          Write-Host "Address:  $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "Connect using Microsoft Remote Desktop."
          Write-Host ""
          Write-Host "======================================"


      # --------------------------------------------------
      # 7. Keep the runner alive
      # --------------------------------------------------
      - name: Maintain RDP Session
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "RDP runner is active."
          Write-Host "The runner will remain available until the job ends."
          Write-Host ""

          while ($true) {

              Write-Host "[$(Get-Date)] RDP Active..."

              Start-Sleep -Seconds 300
          }
